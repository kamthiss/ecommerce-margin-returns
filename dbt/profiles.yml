ecommerce:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5434') | int }}"
      dbname: "{{ env_var('PGDATABASE', 'ecommerce') }}"
      user: "{{ env_var('PGUSER', 'analyst') }}"
      password: "{{ env_var('PGPASSWORD', 'analyst') }}"
      schema: public
      threads: 4
